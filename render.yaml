services:
  - type: web
    name: jobsphere-api
    runtime: docker
    rootDir: backend
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_HOST
        fromDatabase:
          name: jobsphere-db
          property: host
      - key: DATABASE_PORT
        fromDatabase:
          name: jobsphere-db
          property: port
      - key: DATABASE_NAME
        fromDatabase:
          name: jobsphere-db
          property: database
      - key: DATABASE_USERNAME
        fromDatabase:
          name: jobsphere-db
          property: user
      - key: DATABASE_PASSWORD
        fromDatabase:
          name: jobsphere-db
          property: password
      - key: JPA_DDL_AUTO
        value: update

  - type: web
    name: jobsphere-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        fromService:
          name: jobsphere-api
          type: web
          envVarKey: RENDER_EXTERNAL_URL
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: jobsphere-db
    plan: free
